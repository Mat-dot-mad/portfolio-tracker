<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retirement — Portfolio Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        .chart-container { position: relative; height: 380px; }
        .card-value { font-size: 1.5rem; font-weight: 700; }
        .card-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--bs-secondary-color); }
        .card-detail { font-size: 0.85rem; color: var(--bs-secondary-color); }
        .text-positive { color: #198754; }
        .text-negative { color: #dc3545; }
        #loading { text-align: center; padding: 4rem 0; }

        /* Levers */
        .lever .lever-label { font-size: 0.75rem; text-transform: uppercase;
                              letter-spacing: 0.4px; color: var(--bs-secondary-color); }
        .lever-value { font-size: 1.2rem; font-weight: 700; line-height: 1.25; }
        .lever-note { font-size: 0.72rem; color: var(--bs-secondary-color); min-height: 1.05rem; }
        .lever.inactive { opacity: 0.45; }
        .lever-ticks { position: relative; height: 0.9rem; font-size: 0.62rem;
                       color: var(--bs-secondary-color); }
        .lever-ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }

        /* Dim results during a recalculation without collapsing layout or
           blanking the chart. */
        .recalculating { opacity: 0.5; transition: opacity 0.12s ease; }

        .setting-row label { font-size: 0.85rem; margin-bottom: 0.15rem; }
        .setting-row input, .setting-row select { font-size: 0.9rem; }
        .setting-note { font-size: 0.75rem; color: var(--bs-secondary-color); }
        .bucket-bar { height: 26px; border-radius: 4px; overflow: hidden; display: flex; }
        .bucket-bar span { display: flex; align-items: center; justify-content: center;
                           font-size: 0.72rem; color: #fff; white-space: nowrap; }

        /* Projection table */
        .projection-table { font-size: 0.8rem; font-variant-numeric: tabular-nums; }
        .projection-table td, .projection-table th { padding: 0.3rem 0.5rem; white-space: nowrap; }
        .projection-table thead th { background: var(--bs-body-bg); }
        .projection-table td.num, .projection-table th.num { text-align: right; }
        .projection-table tr.retired td { background: rgba(13, 110, 253, 0.05); }
        .projection-table tr.short td { background: rgba(220, 53, 69, 0.13); }
        .projection-table td.locked { color: var(--bs-secondary-color); }
        .projection-table tr.milestone td { border-top: 2px solid var(--bs-border-color); }
        .split-chip { font-size: 0.75rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Portfolio Tracker</span>
        <div class="d-flex align-items-center gap-2 flex-wrap justify-content-end">
            <a href="/" class="btn btn-sm btn-outline-light">Dashboard</a>
            <a href="/compare" class="btn btn-sm btn-outline-light">Compare</a>
            <a href="/forecast" class="btn btn-sm btn-outline-light">Forecast</a>
            <a href="/retirement" class="btn btn-sm btn-outline-light active">Retirement</a>
            <button class="btn btn-sm btn-outline-light" id="themeToggle" onclick="toggleTheme()">Dark</button>
        </div>
    </div>
</nav>

<div class="container" id="app">
    <div id="loading">Loading…</div>
</div>

<template id="retirement-template">
<div>
    <div class="d-flex justify-content-between align-items-center mb-1">
        <h4 class="mb-0">Retirement</h4>
        <span class="small" id="update-status"></span>
    </div>
    <p class="text-muted small mb-4">
        A projection of what your assumptions imply — not financial advice, and not a
        recommendation to retire at any particular age. All figures are in
        <strong>today's money</strong>.
    </p>

    <!-- Headline results -->
    <div class="row g-3 mb-4" id="results-row">
        <div class="col-md-4">
            <div class="card h-100"><div class="card-body">
                <div class="card-label">Earliest feasible age</div>
                <div class="card-value" id="earliest-age">—</div>
                <div class="card-detail" id="earliest-detail"></div>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card h-100"><div class="card-body">
                <div class="card-label">Success at chosen age</div>
                <div class="card-value" id="chosen-rate">—</div>
                <div class="card-detail" id="chosen-detail"></div>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card h-100"><div class="card-body">
                <div class="card-label">Sustainable spend at chosen age</div>
                <div class="card-value" id="sustainable">—</div>
                <div class="card-detail">per year, today's money</div>
            </div></div>
        </div>
    </div>

    <!-- Levers. Markup is generated from one config in retirement.js so the
         ranges are defined in a single place. -->
    <div class="row g-3 mb-3" id="levers-primary"></div>
    <div class="row g-3 mb-4" id="levers-secondary"></div>

    <!-- Accessibility of current capital -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">What you can actually reach, and when</h5>
            <p class="text-muted small mb-2" id="bucket-summary"></p>
            <div class="bucket-bar mb-2" id="bucket-bar"></div>
            <p class="setting-note mb-0">
                Retiring before the IKE age means bridging on the taxable portion alone.
                A plan can look fully funded on total net worth and still fail on that bridge.
            </p>
        </div>
    </div>

    <!-- Projection chart -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Projected capital</h5>
            <div class="text-muted small mb-3" id="chart-note"></div>
            <div class="chart-container"><canvas id="retirement-chart"></canvas></div>
        </div>
    </div>

    <!-- Year-by-year detail, for checking where the projection goes -->
    <div class="card mb-4">
        <div class="card-header bg-transparent d-flex justify-content-between align-items-center"
             style="cursor:pointer;" data-bs-toggle="collapse" data-bs-target="#projectionBody">
            <h5 class="mb-0">Year-by-year projection</h5>
            <span class="text-muted small">click to expand</span>
        </div>
        <div class="collapse" id="projectionBody">
            <div class="card-body">
                <div class="text-muted small mb-3" id="projection-note"></div>
                <div id="account-split" class="mb-3"></div>
                <div class="table-responsive" style="max-height: 30rem; overflow-y: auto;">
                    <table class="table table-sm projection-table mb-0">
                        <thead class="sticky-top" id="projection-head"></thead>
                        <tbody id="projection-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Everything that rarely changes -->
    <div class="card mb-4">
        <div class="card-header bg-transparent d-flex justify-content-between align-items-center"
             style="cursor:pointer;" data-bs-toggle="collapse" data-bs-target="#settingsBody">
            <h5 class="mb-0">Assumptions &amp; personal details</h5>
            <span class="text-muted small">click to expand</span>
        </div>
        <div class="collapse" id="settingsBody">
            <div class="card-body">

                <h6 class="mb-2">You</h6>
                <div class="row g-3 setting-row mb-3">
                    <div class="col-md-3"><label for="current_age">Current age</label>
                        <input type="number" class="form-control form-control-sm" id="current_age"></div>
                    <div class="col-md-3"><label for="success_threshold">Required success rate</label>
                        <input type="number" step="0.01" class="form-control form-control-sm" id="success_threshold">
                        <div class="setting-note">0.90 = must survive in 90% of runs</div></div>
                </div>

                <h6 class="mb-2">ZUS</h6>
                <div class="row g-3 setting-row mb-3">
                    <div class="col-md-3"><label for="zus_annual">Projected pension, per year</label>
                        <input type="number" class="form-control form-control-sm" id="zus_annual">
                        <div class="setting-note">from your ZUS letter / PUE, today's money</div></div>
                    <div class="col-md-3"><label for="zus_start_age">Starts at age</label>
                        <input type="number" class="form-control form-control-sm" id="zus_start_age"></div>
                </div>

                <h6 class="mb-2">PPK</h6>
                <div class="row g-3 setting-row mb-3">
                    <div class="col-md-3"><label for="ppk_enabled">Contributing?</label>
                        <select class="form-select form-select-sm" id="ppk_enabled">
                            <option value="1">Yes</option><option value="0">No</option></select></div>
                    <div class="col-md-3"><label for="start_ppk">Current PPK balance</label>
                        <input type="number" class="form-control form-control-sm" id="start_ppk">
                        <div class="setting-note" id="start_ppk_note"></div></div>
                    <div class="col-md-3"><label for="ppk_gross_salary">Gross annual salary</label>
                        <input type="number" class="form-control form-control-sm" id="ppk_gross_salary"></div>
                    <div class="col-md-3"><label for="ppk_employee_rate">Your rate</label>
                        <input type="number" step="0.001" class="form-control form-control-sm" id="ppk_employee_rate"></div>
                    <div class="col-md-3"><label for="ppk_employer_rate">Employer rate</label>
                        <input type="number" step="0.001" class="form-control form-control-sm" id="ppk_employer_rate"></div>
                    <div class="col-md-3"><label for="ppk_state_annual">State top-up per year</label>
                        <input type="number" class="form-control form-control-sm" id="ppk_state_annual"></div>
                    <div class="col-md-3"><label for="ppk_access_age">Payout age</label>
                        <input type="number" class="form-control form-control-sm" id="ppk_access_age"></div>
                    <div class="col-md-3"><label for="ppk_lump_sum_fraction">Lump sum share</label>
                        <input type="number" step="0.01" class="form-control form-control-sm" id="ppk_lump_sum_fraction"></div>
                    <div class="col-md-3"><label for="ppk_installment_years">Installments over (years)</label>
                        <input type="number" class="form-control form-control-sm" id="ppk_installment_years"></div>
                </div>

                <h6 class="mb-1">Polish rules</h6>
                <div class="alert alert-warning py-2 small mb-2">
                    Limits are set annually and rates can change.
                    <strong>Verify against current rules</strong> — a stale figure here changes
                    the answer with no visible sign.
                </div>
                <div class="row g-3 setting-row mb-3">
                    <div class="col-md-3"><label for="ike_access_age">IKE accessible from</label>
                        <input type="number" class="form-control form-control-sm" id="ike_access_age"></div>
                    <div class="col-md-3"><label for="ikze_access_age">IKZE accessible from</label>
                        <input type="number" class="form-control form-control-sm" id="ikze_access_age"></div>
                    <div class="col-md-3"><label for="belka_rate">Belka rate (on gains)</label>
                        <input type="number" step="0.01" class="form-control form-control-sm" id="belka_rate"></div>
                    <div class="col-md-3"><label for="ikze_withdrawal_rate">IKZE withdrawal rate</label>
                        <input type="number" step="0.01" class="form-control form-control-sm" id="ikze_withdrawal_rate">
                        <div class="setting-note">flat, on the whole withdrawal</div></div>
                    <div class="col-md-3"><label for="ike_annual_limit">IKE annual limit</label>
                        <input type="number" class="form-control form-control-sm" id="ike_annual_limit"></div>
                    <div class="col-md-3"><label for="ikze_annual_limit">IKZE annual limit</label>
                        <input type="number" class="form-control form-control-sm" id="ikze_annual_limit">
                        <div class="setting-note">employed rate; self-employed is higher</div></div>
                </div>

                <div class="d-flex align-items-center gap-3 pt-3 border-top flex-wrap">
                    <button class="btn btn-outline-danger btn-sm" id="reset-btn"
                            onclick="resetSettings()">Reset everything to defaults</button>
                    <span class="setting-note mb-0" style="max-width: 34rem;">
                        Sliders save as you move them, so exploring a scenario overwrites your
                        real figures. This clears every saved value — the saving rate returns to
                        the one derived from your cash-flow history.
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
</template>

<script src="{{ url_for('static', filename='common.js') }}"></script>
<script src="{{ url_for('static', filename='retirement.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
